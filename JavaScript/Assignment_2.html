<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let multiTotal = 0
        let divTotal = 0
        let subTotal = 0;
        let addTotal = 0;
        let num1 = 0;
        function calculate(num) {
            let calculateNum = num
            num1 = document.getElementById('finalCalculation').innerText += calculateNum;
            return num1;
        }
        function clearCalc() {
            console.log(num1)
            num1 = document.getElementById('finalCalculation').innerText = "";       }
        
        function addCalc(){
            addTotal = new Number(num1);
            num1 = document.getElementById('finalCalculation').innerText = "";
            console.log(addTotal)
            return addTotal;
        }
        function subCalc(){
            subTotal = new Number(num1);
            num1 = document.getElementById('finalCalculation').innerText = "";
            console.log(subTotal)
            return subTotal;
        }
        function divCalc(){
            divTotal = new Number(num1);
            num1 = document.getElementById('finalCalculation').innerText = "";
            console.log(divTotal)
            return divTotal;
        }
        function multiCalc(){
            multiTotal = new Number(num1);
            num1 = document.getElementById('finalCalculation').innerText = "";
            console.log(multiTotal)
            return multiTotal;
        }
        function totalFunc(){
            if(addTotal){
                let total = new Number (document.getElementById('finalCalculation').innerHTML) + addTotal;
                document.getElementById('finalCalculation').innerHTML = total
                addTotal = 0;
                return num1 = total
        } else if(subTotal){
                let total = subTotal - new Number (document.getElementById('finalCalculation').innerHTML);
                document.getElementById('finalCalculation').innerHTML = total
                subTotal = 0;
                return num1 = total
        } else if(divTotal){
                let total = divTotal / new Number (document.getElementById('finalCalculation').innerHTML);
                document.getElementById('finalCalculation').innerHTML = total
                divTotal = 0;
                return num1 = total
            } else {
            let total = multiTotal * new Number (document.getElementById('finalCalculation').innerHTML);
            document.getElementById('finalCalculation').innerHTML = total
            multiTotal = 0;
            return num1 = total
        }
        }

    </script>
</head>
<body>
    <div>
        <div style="display: flex; justify-content: end; background-color: black; color: white; width: 225px; border-radius: 10px;height: 125px; align-items: center; font-size: 30px;">
            <span id="finalCalculation" style="padding-right: 15px;"></span>
        </div>
    </div>
    <div style="background-color: rgb(68, 67, 67); color: white; width: 225px; border-radius: 10px;height: 300px;">
        <div style="display: flex;justify-content: center; align-items: start; font-size: 30px; gap: 10px;">
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="multiCalc()" style="background-color: orange; color: white; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">*</button>
                <button onclick="divCalc()" style="background-color: orange; color: white; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">/</button>
                <button onclick="subCalc()" style="background-color: orange; color: white; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">-</button>
                <button onclick="addCalc()" style="background-color: orange; color: white; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">+</button>
            </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 10px;">
            <button onclick="calculate(9)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">9</button>
            <button onclick="calculate(8)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">8</button>
            <button onclick="calculate(7)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">7</button>
            <button onclick="calculate(6)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">6</button>
        </div>
        <div style="display: flex; justify-content: center; gap: 10px;">
            <button onclick="calculate(5)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">5</button>
            <button onclick="calculate(4)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">4</button>
            <button onclick="calculate(3)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">3</button>
            <button onclick="calculate(2)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">2</button>
        </div>
        <div style="display: flex; justify-content: center; gap: 10px;">
            <button onclick="calculate(1)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">1</button>
            <button onclick="calculate(0)" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">0</button>
            <button onclick="calculate('.')" style="background-color: white; color: black; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">.</button>
            <button onclick="totalFunc()" style="background-color: green; border: white; color: white; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;">=</button>
        </div>
        <div style="display: flex; justify-content: start; gap: 10px;">
            <button onclick="clearCalc()" style="background-color: red; color: white; border: none; border-radius: 2px; height: 40px; width: 40px; margin-top: 10px;margin-left: 18px;">C</button>
            </div>
    </div>
</body>
</html>
